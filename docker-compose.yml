services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: demo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d demo']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  smtp:
    image: greenmail/standalone:latest
    ports:
      - '3025:3025'
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.smtp -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.verbose=false'
    healthcheck:
      test: ['CMD-SHELL', 'perl -MIO::Socket::INET -e "IO::Socket::INET->new(PeerAddr=>\"localhost:3025\") or exit 1"']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
