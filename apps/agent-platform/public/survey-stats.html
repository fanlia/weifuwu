<!DOCTYPE html>
<!-- ⚠️ 本页 module script 为 TS 源码（已转译为 JS 内联）——修改后运行：
     node scripts/transpile-survey.mjs 重新转译（页面是纯 JS 环境——importmap + 浏览器直接执行） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模拟数据收集统计（实时）</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    /* 实时流动态效果：新条目淡入 + 滑入 */
    @keyframes wf-feed-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .feed-item { animation: wf-feed-in 0.35s ease-out; }
    .feed { max-height: 300px; overflow-y: auto; }
    /* 进度点 */
    .prog { display: flex; gap: 4px; }
    .prog-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--wf-color-bg-tertiary); }
    .prog-dot.on { background: var(--wf-color-success); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="importmap">
    {
      "imports": {
        "weifuwu/vdom": "/static/ui-dom/index.js",
        "weifuwu/components": "/static/components/index.js"
      }
    }
  </script>

  <script type="module">import { h, ws, UIRouter, uiServe } from "weifuwu/vdom";
import { Card, Badge, Alert, StatCard, Table, EmptyState, ProgressBar, Space } from "weifuwu/components";
const QUESTIONS = ["1.\u5E74\u9F84", "2.\u884C\u4E1A", "3.\u5173\u6CE8\u80FD\u529B", "4.\u6EE1\u610F\u5EA6", "5.\u5EFA\u8BAE\u53CD\u9988"];
const StatsPage = (_init, ctx) => {
  let count = 0;
  let answers = [];
  let submissions = [];
  let connected = false;
  let online = { count: 0, sources: [], submitted: [] };
  let aggregate = null;
  let wsStatus = "connecting";
  let wsDetail = { attempt: 0, max: 10 };
  const rerender = () => ctx.render();
  // v2 ws 中间件签名 (connected: boolean)（迁移适配——wsDetail 为旧面残留——
  // v2 不暴露重连明细——保留默认值只影响徽章 attempt 文案）
  ctx.ws?.onStatusChange((connected2) => {
    wsStatus = connected2 ? "connected" : "disconnected";
    connected = connected2;
    rerender();
  });
  ctx.ws?.onMessage((msg) => {
    if (msg?.type === "survey:state") {
      count = msg.count ?? count;
      answers = msg.answers ?? answers;
      submissions = msg.submissions ?? submissions;
      online = msg.online ?? online;
      aggregate = msg.aggregate ?? aggregate;
      rerender();
    }
    if (msg?.type === "survey:answer") {
      answers = [...answers, msg];
      rerender();
    }
    if (msg?.type === "survey:submitted") {
      count = msg.count ?? count;
      if (msg.latest) submissions = [...submissions, msg.latest];
      rerender();
    }
    if (msg?.type === "survey:online") {
      online = { count: msg.count ?? 0, sources: msg.sources ?? [], submitted: msg.submitted ?? [] };
      rerender();
    }
  });
  const sourceProgress = () => {
    const map = /* @__PURE__ */ new Map();
    for (const a of answers) {
      const list = map.get(a.source) ?? [];
      list.push(a.question);
      map.set(a.source, list);
    }
    return [...map.entries()].map(([src, qs]) => ({
      source: src,
      done: QUESTIONS.filter((q) => qs.includes(q)).length,
      locked: submissions.some((x) => x.source === src)
    }));
  };
  return () => {
    const progress = sourceProgress();
    // 合并在线来源（刚连接未答题的——显示 0/5 + 在线标记——浏览器未关保持在线）
    for (const src of online.sources) {
      if (!progress.some((p) => p.source === src)) progress.push({ source: src, done: 0, locked: false });
    }
    const feed = [...answers].reverse().slice(0, 30);
    const wsBadge = wsStatus === "connected" ? h(Badge, { variant: "success" }, "\u25CF \u5DF2\u8FDE\u63A5\uFF08\u5B9E\u65F6\uFF09") : wsStatus === "disconnected" ? h(Badge, { variant: "danger" }, `\u25CB \u8FDE\u63A5\u65AD\u5F00\uFF0C\u81EA\u52A8\u91CD\u8FDE\u4E2D\uFF08${wsDetail.attempt}/${wsDetail.max}\uFF09`) : h(Badge, { variant: "warning" }, "\u25CB \u8FDE\u63A5\u4E2D...");
    return h(
      "div",
      { style: { maxWidth: "860px", margin: "32px auto", padding: "0 20px" } },
      h(
        "div",
        { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" } },
        h(
          "div",
          {},
          h("h1", { style: { margin: "0 0 4px", fontSize: "22px" } }, "\u6A21\u62DF\u6570\u636E\u6536\u96C6\u7EDF\u8BA1\uFF08\u5B9E\u65F6\uFF09"),
          h(
            "div",
            { style: { color: "var(--wf-color-text-tertiary)", fontSize: "13px" } },
            "WS \u5B9E\u65F6\u8054\u52A8 \xB7 \u586B\u5B8C\u4E00\u9898\u5373\u540C\u6B65 \xB7 \u63D0\u4EA4\u5373\u9501\u5B9A \xB7 ",
            h("a", { href: "/demo-survey", style: { color: "var(--wf-color-primary)" } }, "\u2190 \u586B\u5199\u9875")
          )
        ),
        h(
          Space,
          { size: "sm" },
          h("span", { style: { fontSize: "12px", color: "var(--wf-color-text-tertiary)" } }, "\u8BA9 AI \u586B\u5199\uFF1A\u8FDB\u5165\u300C\u95EE\u5377\u8C03\u7814\u300D\u90E8\u95E8\u53D1\u6D88\u606F @\u5168\u5458\u2014\u201410 \u4E2A\u89D2\u8272\u540C\u65F6\u54CD\u5E94"),
          wsBadge
        )
      ),
      wsStatus === "disconnected" && h(
        Alert,
        { type: "error", style: { marginBottom: "12px" } },
        `WS \u8FDE\u63A5\u65AD\u5F00\u2014\u2014\u5B9E\u65F6\u6570\u636E\u6682\u505C\uFF08\u81EA\u52A8\u91CD\u8FDE\u4E2D ${wsDetail.attempt}/${wsDetail.max}\uFF09\u2014\u2014\u6062\u590D\u540E\u81EA\u52A8\u540C\u6B65`
      ),
      // 统计卡片（StatCard——内置组件）
      h(
        "div",
        { style: { display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "12px", marginBottom: "16px" } },
        h(StatCard, { label: "\u5DF2\u63D0\u4EA4\uFF08\u9501\u5B9A\uFF09", value: String(count), variant: "success" }),
        h(StatCard, { label: online.sources.length > 0 ? `\u5728\u7EBF\uFF08${online.sources.slice(0, 3).join("\u3001")}${online.sources.length > 3 ? ` \u7B49 ${online.sources.length} \u4EBA` : ""}\uFF09` : "\u5728\u7EBF\u586B\u5199\u8005", value: String(online.count), variant: "primary" }),
        // 填写中的来源 = 未提交 + 在线（已提交不算；下线了也不算——正在填写的才算）
h(StatCard, { label: "\u586B\u5199\u4E2D\u7684\u6765\u6E90", value: String(progress.filter((p) => !p.locked && online.sources.includes(p.source)).length) }),
        h(StatCard, { label: "\u5DF2\u540C\u6B65\u7684\u7B54\u9898\u6570", value: String(answers.length) })
      ),
      // 填写进度（按来源）
      h(
        Card,
        { variant: "default", padding: "md", style: { marginBottom: "16px" } },
        h("h2", { style: { fontSize: "14px", margin: "0 0 12px", color: "var(--wf-color-text-secondary)" } }, "\u586B\u5199\u8FDB\u5EA6"),
        progress.length === 0 ? h(EmptyState, { text: "\u6682\u65E0\u586B\u5199\u8005", hint: "\u6253\u5F00\u586B\u5199\u9875\u5F00\u59CB\u7B54\u9898\u2014\u2014\u6BCF\u9898\u5B9E\u65F6\u540C\u6B65\u5230\u8FD9\u91CC" }) : progress.map(
          (p) => h(
            "div",
            { style: { display: "flex", alignItems: "center", gap: "10px", marginBottom: "8px" } },
            h("span", { style: { width: "100px", fontSize: "13px", fontWeight: 600 } }, p.source),
            online.sources.includes(p.source) && h("span", { title: "\u5728\u7EBF", style: { width: "8px", height: "8px", borderRadius: "50%", background: "var(--wf-color-success)", flexShrink: 0 } }),
            h(
              "div",
              { class: "prog" },
              QUESTIONS.map((q) => h("div", { class: `prog-dot${p.done >= QUESTIONS.indexOf(q) + 1 ? " on" : ""}` }))
            ),
            // ProgressBar 只认 value——percent 被忽略 → indeterminate 扫动动画（提交后仍闪烁）——已修
h(ProgressBar, { value: p.done / 5 * 100, width: 120, showLabel: false }),
            h("span", { style: { fontSize: "12px", color: "var(--wf-color-text-tertiary)" } }, `${p.done}/5 \u9898`),
            p.locked && h(Badge, { variant: "success" }, "\u5DF2\u63D0\u4EA4")
          )
        )
      ),
      // 实时答题流
      h(
        Card,
        { variant: "default", padding: "md", style: { marginBottom: "16px" } },
        h("h2", { style: { fontSize: "14px", margin: "0 0 12px", color: "var(--wf-color-text-secondary)" } }, "\u5B9E\u65F6\u7B54\u9898\u6D41"),
        h(
          "div",
          { class: "feed" },
          feed.length === 0 ? h(EmptyState, { text: "\u7B49\u5F85\u7B54\u9898...", hint: "\u586B\u5199\u9875\u6BCF\u5B8C\u6210\u4E00\u9898\uFF0C\u8FD9\u91CC\u5B9E\u65F6\u6EDA\u52A8" }) : feed.map(
            (a, i) => h(
              "div",
              { key: `${a.at}-${i}`, class: "feed-item", style: { display: "flex", gap: "8px", padding: "6px 0", borderBottom: "1px solid var(--wf-color-border, #eef2f7)", fontSize: "13px" } },
              h("span", { style: { color: "var(--wf-color-text-tertiary)" } }, String(a.at ?? "").slice(11, 19)),
              h("span", { style: { fontWeight: 600, color: "var(--wf-color-primary)" } }, a.source),
              h("span", {}, `${a.question} \u2192`),
              h("span", { style: { color: "var(--wf-color-text-secondary)" } }, String(a.answer ?? "").slice(0, 80))
            )
          )
        )
      ),
      // 聚合分布（S5——2027-09——1000 份的统计意义：行业/年龄/评分直方图）
      aggregate && aggregate.total > 0 && h(
        Card,
        { variant: "default", padding: "md" },
        h("h2", { style: { fontSize: "14px", margin: "0 0 12px", color: "var(--wf-color-text-secondary)" } }, `\u5206\u5E03\u7EDF\u8BA1\uFF08${aggregate.total} \u4EFD\uFF09\u00B7 \u5E73\u5747\u8BC4\u5206 ${String(aggregate.avgRating ?? 0)}/5`),
        [["\u884C\u4E1A", aggregate.byIndustry], ["\u5E74\u9F84", aggregate.byAge], ["\u8BC4\u5206", aggregate.byRating]].map(([label, dist]) => h(
          "div", { style: { marginBottom: "10px" } },
          h("div", { style: { fontWeight: 600, fontSize: "13px", marginBottom: "4px" } }, label),
          Object.entries(dist ?? {}).sort((a, b) => (b[1] ?? 0) - (a[1] ?? 0)).map(([k, v]) => {
            const max = Math.max(1, ...Object.values(dist ?? {}));
            const pct = Math.round(((v ?? 0) / aggregate.total) * 100);
            return h("div", { style: { display: "flex", alignItems: "center", gap: "8px", marginBottom: "2px" } },
              h("span", { style: { width: "72px", fontSize: "12px", color: "var(--wf-color-text-secondary)", textAlign: "right" } }, k),
              h("div", { style: { flex: 1, height: "10px", background: "var(--wf-color-bg-tertiary)", borderRadius: "5px", overflow: "hidden" } },
                h("div", { style: { width: `${(v ?? 0) / max * 100}%`, height: "100%", background: "var(--wf-color-primary)", borderRadius: "5px" } })),
              h("span", { style: { fontSize: "12px", color: "var(--wf-color-text-tertiary)", width: "42px" } }, `${v ?? 0} (${pct}%)`)
            );
          })
        )),
        h("div", { style: { display: "flex", gap: "16px", marginTop: "8px", fontSize: "12px", color: "var(--wf-color-text-tertiary)", flexWrap: "wrap" } },
          Object.entries(aggregate.focus ?? {}).sort((a, b) => (b[1] ?? 0) - (a[1] ?? 0)).slice(0, 8).map(([k, v]) => h("span", { key: k }, `${k} ${v}\u4EBA`))
        )
      ),
      // 已提交明细（Table——内置组件）
      h(
        Card,
        { variant: "default", padding: "md" },
        h("h2", { style: { fontSize: "14px", margin: "0 0 12px", color: "var(--wf-color-text-secondary)" } }, `\u5DF2\u63D0\u4EA4\uFF08${submissions.length} \u4EFD\u2014\u2014\u9501\u5B9A\u4E0D\u53EF\u6539\uFF09`),
        submissions.length === 0 ? h(EmptyState, { text: "\u6682\u65E0\u63D0\u4EA4", hint: "\u586B\u5199\u9875\u63D0\u4EA4\u540E\u8FD9\u91CC\u5B9E\u65F6\u51FA\u73B0" }) : h(Table, {
          columns: [
            { key: "source", title: "\u6765\u6E90" },
            { key: "at", title: "\u65F6\u95F4" },
            { key: "industry", title: "\u884C\u4E1A" },
            { key: "age", title: "\u5E74\u9F84" },
            { key: "rating", title: "\u8BC4\u5206" },
            { key: "focus", title: "\u5173\u6CE8" },
            { key: "feedback", title: "\u53CD\u9988" }
          ],
          data: [...submissions].reverse().map((r) => ({
            source: r.source,
            at: String(r.submitted_at ?? "").slice(5, 16).replace("T", " "),
            industry: r.industry ?? "\u2014",
            age: r.age ?? "\u2014",
            rating: String(r.rating ?? "\u2014"),
            focus: (r.focus ?? []).join("\u3001") || "\u2014",
            feedback: String(r.feedback ?? "").slice(0, 100)
          })),
          size: "sm"
        })
      )
    );
  };
};
    // v2 挂载（S7a——统计页迁移 vdom 面——stream debug 依赖移除）
    const router = new UIRouter();
    router.get("/demo-survey/stats", (_req, ctx) => { ctx.stream(h(StatsPage, {})); return new Response(null, { status: 200 }); });
    const surveyWs = ws({ url: "/survey-live", autoReconnect: { baseMs: 1000, maxMs: 10000 } });
    surveyWs.connect("/survey-live");
    uiServe(router, { root: "#root", ws: surveyWs });
</script>
</body>
</html>
