<!DOCTYPE html>
<!-- ⚠️ 本页 module script 为 TS 源码（已转译为 JS 内联）——修改后运行：
     node scripts/transpile-survey.mjs 重新转译（页面是纯 JS 环境——importmap + 浏览器直接执行） -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模拟数据收集问卷</title>
  <!-- weifuwu CDN（本地）：组件样式一条 link -->
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="root"></div>

  <script type="importmap">
    {
      "imports": {
        "weifuwu/vdom": "/static/ui-dom/index.js",
        "weifuwu/components": "/static/components/index.js"
      }
    }
  </script>

  <script type="module">import { h, ws, UIRouter, uiServe } from "weifuwu/vdom";
import {
  Card,
  Button,
  Badge,
  Alert,
  Textarea,
  Select,
  RadioGroup,
  CheckboxGroup,
  Rate
} from "weifuwu/components";
const source = new URLSearchParams(location.search).get("s") || "\u8BBF\u5BA2-" + Math.random().toString(36).slice(2, 5);
const SurveyForm = (_init, ctx) => {
  let submitted = null;
  let error = "";
  let submitting = false;
  let wsStatus = "connecting";
  let wsDetail = { attempt: 0, max: 10 };
  const rerender = () => ctx.render();
  // v2 ws 中间件签名 (connected: boolean)（2027-09 v1→v2 迁移：旧面是
  // 'connecting'/'connected'/'disconnected' 字符串 + detail——v2 只有 boolean——
  // 适配：boolean → 页面状态词；重连后重发 hello（ws 重连 = 新 socket——
  // 服务端 surveyOnline 无记录——浏览器未关仍应在线）
  ctx.ws?.onStatusChange((connected) => {
    wsStatus = connected ? "connected" : "disconnected";
    if (connected) ctx.ws?.send({ type: "survey:hello", source });
    rerender();
  });
  // 逐题同步：合并 pending（快速连续操作不互相取消——真实用户快填丢题的体验缺口）
  // + flush（提交前补发全部 pending——统计页答题流完整）——单题失败不中断（保留重试）
  let debounceTimer = null;
  let pendingSync = {};
  const flushSync = () => {
    clearTimeout(debounceTimer);
    debounceTimer = null;
    const failed = {};
    for (const q of Object.keys(pendingSync)) {
      try {
        ctx.ws?.send({ type: "survey:answer", source, question: q, answer: pendingSync[q] });
      } catch (e) {
        failed[q] = pendingSync[q];
      }
    }
    pendingSync = failed;
  };
  const syncAnswer = (question, answer) => {
    if (submitted || !answer) return;
    pendingSync[question] = answer;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(flushSync, 400);
  };
  let age = "";
  let industry = "\u4E92\u8054\u7F51"; // 默认选中第一项（互联网/IT——原生 select 自动选第一个可用项）——用户不改也算已选——提交必填通过
  let focus = [];
  let rating = 0;
  let feedback = "";
  const sync = (q, v) => syncAnswer(q, v);
  const submit = () => {
    if (submitting || submitted) return;
    if (wsStatus !== "connected") {
      error = "WS \u672A\u8FDE\u63A5\u2014\u2014\u8BF7\u7B49\u5F85\u8FDE\u63A5\u6062\u590D\u540E\u91CD\u8BD5";
      rerender();
      return;
    }
    error = "";
    if (!age || !industry || !rating) {
      error = "\u8BF7\u5B8C\u6210\u5FC5\u586B\u9879\uFF08\u5E74\u9F84/\u884C\u4E1A/\u6EE1\u610F\u5EA6\uFF09";
      rerender();
      return;
    }
    submitting = true;
    rerender();
    // 提交前 flush 全部 pending 答题（统计页答题流完整——快速填写不丢题）
    // 默认值补同步：行业默认选中（用户未改）——提交即确认——答题流/进度完整
    if (industry && !pendingSync["2.\u884C\u4E1A"]) pendingSync["2.\u884C\u4E1A"] = industry;
    flushSync();
    ctx.ws?.send({ type: "survey:submit", source, data: { age, industry, rating, focus, feedback } });
    setTimeout(() => {
      if (submitting && !submitted) {
        submitting = false;
        error = "\u63D0\u4EA4\u8D85\u65F6\u672A\u786E\u8BA4\u2014\u2014\u8BF7\u7A0D\u540E\u91CD\u8BD5";
        rerender();
      }
    }, 25e3);
  };
  // hello 统一走 onStatusChange（connected 时发——首连/重连都覆盖——mount 不单独发）
  ctx.ws?.onMessage((msg) => {
    if (msg?.type === "survey:state") {
      const mine = (msg.submissions ?? []).find((x) => x.source === source);
      if (mine) {
        submitted = mine;
        submitting = false;
      }
    }
    if (msg?.type === "survey:submitted") {
      if (msg.latest?.source === source) {
        submitted = { id: msg.latest.id ?? "", count: msg.count ?? 0 };
        submitting = false;
      }
      rerender();
    }
  });
  return () => {
    const lock = !!submitted;
    const wsBadge = wsStatus === "connected" ? h(Badge, { variant: "success" }, "\u25CF \u5DF2\u8FDE\u63A5\uFF08\u5B9E\u65F6\u8054\u52A8\uFF09") : wsStatus === "disconnected" ? h(Badge, { variant: "danger" }, `\u25CB \u8FDE\u63A5\u65AD\u5F00\uFF0C\u81EA\u52A8\u91CD\u8FDE\u4E2D\uFF08${wsDetail.attempt}/${wsDetail.max}\uFF09`) : h(Badge, { variant: "warning" }, "\u25CB \u8FDE\u63A5\u4E2D...");
    return h(
      "div",
      { style: { maxWidth: "640px", margin: "32px auto", padding: "0 20px" } },
      h(
        Card,
        { variant: "default", padding: "lg" },
        h(
          "div",
          { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
          h(
            "div",
            {},
            h("h1", { style: { margin: "0 0 4px", fontSize: "22px" } }, "\u6A21\u62DF\u6570\u636E\u6536\u96C6\u95EE\u5377"),
            h(
              "div",
              { style: { color: "var(--wf-color-text-tertiary)", fontSize: "13px" } },
              `\u6765\u6E90\uFF1A${source} \xB7 `,
              h("a", { href: "/demo-survey/stats", style: { color: "var(--wf-color-primary)" } }, "\u5B9E\u65F6\u7EDF\u8BA1 \u2192")
            )
          ),
          wsBadge
        ),
        wsStatus === "disconnected" && h(
          Alert,
          { type: "error", title: "WS \u8FDE\u63A5\u65AD\u5F00", style: { marginTop: "12px" } },
          `\u5B9E\u65F6\u8054\u52A8\u4E0D\u53EF\u7528\u2014\u2014\u81EA\u52A8\u91CD\u8FDE\u4E2D\uFF08\u7B2C ${wsDetail.attempt}/${wsDetail.max} \u6B21\uFF09\u2014\u2014\u6062\u590D\u540E\u81EA\u52A8\u540C\u6B65`
        ),
        lock && h(Alert, { type: "success", style: { marginTop: "12px" } }, `\u2705 \u5DF2\u63D0\u4EA4\uFF08#${submitted.id}\uFF09\u2014\u2014\u4E0D\u53EF\u4FEE\u6539`),
        h(
          "div",
          { class: lock ? "wf-tour-layer" : "", style: lock ? { opacity: 0.6, pointerEvents: "none" } : {} },
          // 1. 年龄（RadioGroup）
          h(
            "div",
            { style: { margin: "18px 0 8px", fontWeight: 600, fontSize: "15px" } },
            "1. \u60A8\u7684\u5E74\u9F84",
            h("span", { style: { color: "var(--wf-color-text-tertiary)", fontSize: "12px", fontWeight: 400, marginLeft: "6px" } }, "\u5355\u9009 \xB7 \u5FC5\u586B")
          ),
          h(RadioGroup, {
            options: ["18-25", "26-35", "36-45", "46+"].map((v) => ({ value: v, label: v })),
            value: age,
            onChange: (v) => {
              age = v;
              sync("1.\u5E74\u9F84", v);
              rerender();
            }
          }),
          // 2. 行业（Select）
          h(
            "div",
            { style: { margin: "18px 0 8px", fontWeight: 600, fontSize: "15px" } },
            "2. \u60A8\u6240\u5728\u7684\u884C\u4E1A",
            h("span", { style: { color: "var(--wf-color-text-tertiary)", fontSize: "12px", fontWeight: 400, marginLeft: "6px" } }, "\u5355\u9009 \xB7 \u5FC5\u586B")
          ),
          h(Select, {
            options: [["\u4E92\u8054\u7F51", "\u4E92\u8054\u7F51/IT"], ["\u5236\u9020", "\u5236\u9020/\u5DE5\u4E1A"], ["\u91D1\u878D", "\u91D1\u878D/\u4FDD\u9669"], ["\u96F6\u552E", "\u96F6\u552E/\u6D88\u8D39"], ["\u6559\u80B2", "\u6559\u80B2/\u57F9\u8BAD"]].map(([v, l]) => ({ value: v, label: l })),
            value: industry,
            placeholder: "\u8BF7\u9009\u62E9\u884C\u4E1A",
            onChange: (v) => {
              industry = v;
              sync("2.\u884C\u4E1A", v);
              rerender();
            }
          }),
          // 3. 关注能力（CheckboxGroup）
          h(
            "div",
            { style: { margin: "18px 0 8px", fontWeight: 600, fontSize: "15px" } },
            "3. \u60A8\u5173\u6CE8\u7684\u4EA7\u54C1\u80FD\u529B",
            h("span", { style: { color: "var(--wf-color-text-tertiary)", fontSize: "12px", fontWeight: 400, marginLeft: "6px" } }, "\u591A\u9009")
          ),
          h(CheckboxGroup, {
            options: ["\u6613\u7528\u6027", "\u5B89\u5168\u6027", "\u6027\u80FD", "\u4EF7\u683C", "\u552E\u540E\u670D\u52A1"].map((v) => ({ value: v, label: v })),
            value: focus,
            onChange: (v) => {
              focus = v;
              sync("3.\u5173\u6CE8\u80FD\u529B", v.join("\u3001"));
              rerender();
            }
          }),
          // 4. 满意度（Rate）
          h(
            "div",
            { style: { margin: "18px 0 8px", fontWeight: 600, fontSize: "15px" } },
            "4. \u603B\u4F53\u6EE1\u610F\u5EA6",
            h("span", { style: { color: "var(--wf-color-text-tertiary)", fontSize: "12px", fontWeight: 400, marginLeft: "6px" } }, "\u6253\u5206 1-5 \xB7 \u5FC5\u586B")
          ),
          h(Rate, { value: rating, onChange: (v) => {
            rating = v;
            sync("4.\u6EE1\u610F\u5EA6", String(v));
            rerender();
          } }),
          // 5. 建议反馈（Textarea）
          h(
            "div",
            { style: { margin: "18px 0 8px", fontWeight: 600, fontSize: "15px" } },
            "5. \u5EFA\u8BAE\u4E0E\u53CD\u9988",
            h("span", { style: { color: "var(--wf-color-text-tertiary)", fontSize: "12px", fontWeight: 400, marginLeft: "6px" } }, "\u6587\u672C")
          ),
          h(Textarea, {
            value: feedback,
            placeholder: "\u8BF7\u7559\u4E0B\u60A8\u7684\u5EFA\u8BAE...",
            // Textarea 的输入 prop 是 onInput（事件对象）——非 onChange
            onInput: (e) => {
              const v = e.target.value;
              feedback = v;
              sync("5.\u5EFA\u8BAE\u53CD\u9988", v);
              rerender();
            }
          }),
          error && h(Alert, { type: "error", style: { marginTop: "12px" } }, error),
          h(
            "div",
            { style: { marginTop: "24px" } },
            h(
              Button,
              { variant: "primary", size: "lg", disabled: submitting || lock, onClick: submit },
              submitting ? "\u63D0\u4EA4\u4E2D\uFF08\u7B49\u5F85\u786E\u8BA4\uFF09..." : lock ? "\u5DF2\u63D0\u4EA4\uFF08\u9501\u5B9A\uFF09" : wsStatus !== "connected" ? "\u63D0\u4EA4\uFF08\u7B49\u5F85\u8FDE\u63A5...\uFF09" : "\u63D0\u4EA4\u95EE\u5377"
            )
          )
        )
      )
    );
  };
};
// v2 挂载（S7a——2027-09：v1 退役后 ui-dom 产物消失——迁移 vdom 面——
// UIRouter 单路由 + ws 中间件显式连接——页面组件树不动）
const router = new UIRouter();
router.get("/demo-survey", (_req, ctx) => { ctx.stream(h(SurveyForm, {})); return new Response(null, { status: 200 }); });
const surveyWs = ws({ url: "/survey-live", autoReconnect: { baseMs: 1000, maxMs: 10000 } });
surveyWs.connect("/survey-live");
uiServe(router, { root: "#root", ws: surveyWs });
</script>
</body>
</html>
