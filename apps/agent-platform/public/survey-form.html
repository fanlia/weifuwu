<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模拟数据收集问卷</title>
  <!-- weifuwu CDN（本地）：组件样式一条 link -->
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body { background: var(--wf-color-bg); color: var(--wf-color-text); }
    .q { font-weight: 600; font-size: 15px; margin: 20px 0 8px; }
    .hint { color: var(--wf-color-text-tertiary); font-size: 12px; font-weight: 400; margin-left: 6px; }
    input[type=text], textarea, select { width: 100%; padding: 10px 12px; border: 1px solid var(--wf-color-border, #d1d5db); border-radius: var(--wf-radius, 8px); font-size: 14px; box-sizing: border-box; background: var(--wf-color-surface); color: var(--wf-color-text); }
    textarea { min-height: 72px; }
    .opts { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
    .opts label { font-weight: 400; font-size: 14px; display: flex; gap: 8px; align-items: center; }
    .stars { display: flex; gap: 12px; margin-top: 6px; }
    .stars label { display: flex; flex-direction: column; align-items: center; font-size: 12px; gap: 2px; }
    .stars input { width: 18px; height: 18px; }
    .error { color: var(--wf-color-error, #dc2626); font-size: 13px; margin-top: 10px; display: none; }
    .locked { opacity: 0.55; pointer-events: none; }
    .lock-banner { text-align: center; padding: 10px; background: var(--wf-color-success-bg); color: var(--wf-color-success-text); border-radius: 8px; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="importmap">
    {
      "imports": {
        "weifuwu/ui-dom": "/static/ui-dom/index.js",
        "weifuwu/components": "/static/components/index.js"
      }
    }
  </script>

  <script type="module">
    import { UIRouter, uiServe, h, ws } from 'weifuwu/ui-dom'
    import { Card, Button, Badge } from 'weifuwu/components'

    // 来源标识（URL ?s= 或随机——统计页按来源分组显示进度）
    const source = new URLSearchParams(location.search).get('s') || ('访客-' + Math.random().toString(36).slice(2, 5))

    const SurveyForm = async (_init, ctx) => {
      let submitted = null          // 提交结果 { id, count }
      let error = ''
      let submitting = false
      let connected = false
      let wsReady = false

      // 逐题同步（防抖 400ms——填完一题即推送到统计页）
      let debounceTimer = null
      const syncAnswer = (question, answer) => {
        if (submitted || !answer) return
        clearTimeout(debounceTimer)
        debounceTimer = setTimeout(() => {
          ctx.ws?.send({ type: 'survey:answer', source, question, answer })
        }, 400)
      }
      const collect = () => Object.fromEntries(new FormData(document.getElementById('survey')).entries())

      const onFieldChange = (e) => {
        if (submitted) return
        const f = e.target
        const q = { age: '1.年龄', industry: '2.行业', focus: '3.关注能力', rating: '4.满意度', feedback: '5.建议反馈' }[f.name]
        if (!q) return
        // 单选/多选：取当前选中值
        const form = document.getElementById('survey')
        if (f.type === 'checkbox') {
          syncAnswer(q, [...form.querySelectorAll(`input[name="${f.name}"]:checked`)].map(x => x.value).join('、'))
        } else if (f.type === 'radio') {
          const checked = form.querySelector(`input[name="${f.name}"]:checked`)
          if (checked) syncAnswer(q, checked.value)
        } else {
          syncAnswer(q, f.value)
        }
      }

      const submit = (e) => {
        e.preventDefault()
        if (submitting || submitted) return
        const data = collect()
        error = ''
        if (!data.age || !data.industry || !data.rating) {
          error = '请完成必填项（年龄/行业/满意度）'
          ctx.ui.render()
          return
        }
        submitting = true
        ctx.ui.render()
        // WS 提交（框架 ctx.ws——不落库，统计页实时 +1）
        ctx.ws?.send({ type: 'survey:submit', source, data })
        // 等广播回执（survey:submitted 事件更新计数）——先本地乐观锁定
        submitted = { id: '提交中...', count: 0 }
        ctx.ui.render()
      }

      // 在线报到（WS 排队机制：连接前 send 自动 flush）
      ctx.ws?.send({ type: 'survey:hello', source })

      ctx.ws?.onMessage((msg) => {
        if (msg?.type === 'connected') { connected = true; ctx.ui.render() }
        if (msg?.type === 'survey:state') {
          const mine = (msg.submissions ?? []).find((x) => x.source === source)
          if (mine) { submitted = mine; submitting = false }
        }
        if (msg?.type === 'survey:submitted') {
          // 只锁自己的提交（真实 bug：任何角色提交广播都会让其他页面误锁，
          // 显示别人的提交编号——AI 看到'已提交'后停止操作 → 假提交）
          if (msg.latest?.source === source) {
            submitted = { id: msg.latest.id ?? '', count: msg.count ?? 0 }
            submitting = false
          }
          ctx.ui.render()
        }
      })

      const q1 = (label, hint) => h('label', { class: 'q' }, label, ' ', h('span', { class: 'hint' }, hint))

      return () => {
        const lock = !!submitted
        return h('div', { style: { maxWidth: '640px', margin: '32px auto', padding: '0 20px' } },
          h(Card, { variant: 'default', padding: 'lg' },
            h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
              h('div', {},
                h('h1', { style: { margin: '0 0 4px', fontSize: '22px' } }, '模拟数据收集问卷'),
                h('div', { style: { color: 'var(--wf-color-text-tertiary)', fontSize: '13px' } },
                  `来源：${source} · `, h('a', { href: '/demo-survey/stats', style: { color: 'var(--wf-color-primary)' } }, '实时统计 →'),
                ),
              ),
              connected
                ? h(Badge, { variant: 'success' }, '● 实时联动')
                : h(Badge, { variant: 'warning' }, '连接中...'),
            ),
            lock && h('div', { class: 'lock-banner', style: { marginTop: '12px' } }, `✅ 已提交（#${submitted.id}）——不可修改`),
            h('form', { id: 'survey', onSubmit: submit, class: lock ? 'locked' : '', style: lock ? { opacity: 0.6 } : {} },
              q1('1. 您的年龄', '单选'),
              h('div', { class: 'opts' },
                ['18-25', '26-35', '36-45', '46+'].map((v) =>
                  h('label', {}, h('input', { type: 'radio', name: 'age', value: v, onChange: onFieldChange }), ` ${v}`)),
              ),
              q1('2. 您所在的行业', '单选'),
              h('div', { class: 'opts' },
                [['互联网', '互联网/IT'], ['制造', '制造/工业'], ['金融', '金融/保险'], ['零售', '零售/消费'], ['教育', '教育/培训']].map(([v, l]) =>
                  h('label', {}, h('input', { type: 'radio', name: 'industry', value: v, onChange: onFieldChange }), ` ${l}`)),
              ),
              q1('3. 您关注的产品能力', '多选'),
              h('div', { class: 'opts' },
                ['易用性', '安全性', '性能', '价格', '售后服务'].map((v) =>
                  h('label', {}, h('input', { type: 'checkbox', name: 'focus', value: v, onChange: onFieldChange }), ` ${v}`)),
              ),
              q1('4. 总体满意度', '打分 1-5'),
              h('div', { class: 'stars' },
                [1, 2, 3, 4, 5].map((v) =>
                  h('label', {}, h('input', { type: 'radio', name: 'rating', value: String(v), onChange: onFieldChange }), String(v))),
              ),
              q1('5. 建议与反馈', '文本'),
              h('textarea', { name: 'feedback', placeholder: '请留下您的建议...', onChange: onFieldChange }),
              error && h('div', { class: 'error', style: { display: 'block' } }, error),
              h('div', { style: { marginTop: '24px' } },
                h(Button, { variant: 'primary', type: 'submit', size: 'lg', disabled: submitting || lock },
                  submitting ? '提交中...' : lock ? '已提交（锁定）' : '提交问卷'),
              ),
            ),
          ),
        )
      }
    }

    const router = new UIRouter()
    router.use(ws({ url: '/survey-live' }))   // 框架 ws 中间件——问卷联动端点
    router.get('/', async () => h(SurveyForm, {}))
    router.notFound(async () => h(SurveyForm, {}))
    uiServe(router, { root: document.getElementById('root') })
  </script>
</body>
</html>
