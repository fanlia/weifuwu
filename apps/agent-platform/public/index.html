<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }

    /* ── Chat 消息布局 ── */
    .msg-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .msg-row.own { flex-direction: row-reverse; }
    .msg-col { display: flex; flex-direction: column; gap: 2px; max-width: 70%; }
    .msg-row.own .msg-col { align-items: flex-end; }
    .msg-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3, #999); }
    .msg-row.own .msg-meta { flex-direction: row-reverse; }
    .bubble { padding: 8px 14px; border-radius: 14px; background: var(--bubble-bg, #e8e8e8); line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .msg-row.own .bubble { background: var(--primary, #4f6ef7); color: #fff; border-bottom-right-radius: 4px; }
    .msg-row:not(.own) .bubble { border-bottom-left-radius: 4px; }
    .bubble-ai { background: #f0f0ff !important; color: #333 !important; border: 1px solid #e4e4f0; border-bottom-left-radius: 4px; border-bottom-right-radius: 14px; }
    .ava { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .ava-sm { width: 28px; height: 28px; font-size: 12px; }
    .ava-user { background: #e8f0fe; color: #4a7cff; }
    .ava-ai { background: #f0f0ff; color: #6b5bff; }
    .ava-webhook { background: #fff3e0; color: #f57c00; }
    .ava-knowledge_base { background: #e8f5e9; color: #388e3c; }
    .tool-running { opacity: .7; }

    /* ── 滚动条样式 ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="{{script}}"></script>
</body>
</html>
