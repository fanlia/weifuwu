# agent-platform 私有化一键部署（R7 交付链）
#
# 用法：
#   cp .env.example .env && vim .env      # 必配：DATABASE_URL/JWT_SECRET/DEEPSEEK_API_KEY
#   docker compose up -d --build
#   docker compose logs -f app            # 看启动日志
#   curl http://localhost:3000/healthz    # 健康检查
#
# 可选组件：沙盒（Docker-in-Docker 或宿主 Docker socket——生产建议单独部署沙盒节点）
# 高安全：SANDBOX_RUNTIME=runsc（需镜像内置 gVisor 运行时）

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-agent}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agent-pass-change-me}
      POSTGRES_DB: ${PG_DB:-agent_platform}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PG_USER:-agent}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..          # monorepo 根（Dockerfile 复制 src + apps/agent-platform）
      dockerfile: apps/agent-platform/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # ── 必配（生产替换） ──
      DATABASE_URL: postgres://${PG_USER:-agent}:${PG_PASSWORD:-agent-pass-change-me}@postgres:5432/${PG_DB:-agent_platform}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必填（至少 32 字符）}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY 必填}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # ── 商业化配置（按需） ──
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      LICENSE_KEY: ${LICENSE_KEY:-}
      LICENSE_TO: ${LICENSE_TO:-}
      WHITE_LABEL_NAME: ${WHITE_LABEL_NAME:-}
      WHITE_LABEL_BRAND: ${WHITE_LABEL_BRAND:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_APP_SLUG: ${OIDC_APP_SLUG:-}
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      AGENT_WORKSPACE_ROOT: /data/workspaces
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - workspace-data:/data/workspaces
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pg-data:
  redis-data:
  workspace-data:
