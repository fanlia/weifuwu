# aippt 私有化一键部署
# 用法: cd apps/aippt && DEEPSEEK_API_KEY=sk-xxx docker compose up --build

services:
  aippt:
    build:
      context: ../..
      dockerfile: apps/aippt/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://root:123456@postgres:5432/aippt
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请在 .env 或环境变量中设置 DEEPSEEK_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: aippt
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d aippt']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aippt-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  aippt-pgdata:
