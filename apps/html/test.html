<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weifuwu 计数器 - CDN 示例</title>

    <!-- weifuwu/components 样式（CDN） -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/weifuwu@latest/dist/components/style.css"
    />

    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f7f9fc;
        padding: 2rem;
      }

      /* 全局设计 Token 覆盖（可选） */
      :root {
        --wf-color-primary: #4f6ef7;
        --wf-color-primary-hover: #3b5ae0;
        --wf-color-primary-bg: #eef1ff;
      }

      .demo-title {
        font-size: 1.6rem;
        font-weight: 300;
        color: #4a5568;
        margin: 0 0 0.25rem 0;
      }

      .demo-value {
        font-size: 4rem;
        font-weight: 600;
        color: #1a202c;
        line-height: 1.2;
        text-align: center;
        margin: 0.25rem 0 0.75rem 0;
      }

      .demo-row {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 0.75rem;
      }

      .demo-status {
        text-align: center;
        margin-top: 1rem;
        font-size: 0.95rem;
        color: #718096;
      }

      .demo-divider {
        margin: 1rem 0;
        border: none;
        border-top: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body>
    <!-- 应用挂载点 -->
    <div id="root"></div>

    <!--
      1. Import Map — 将 weifuwu/client 和 weifuwu/components
          映射到 CDN 地址（unpkg）
    -->
    <script type="importmap">
      {
        "imports": {
          "weifuwu/client": "https://unpkg.com/weifuwu@0.51.0/dist/client/index.js",
          "weifuwu/components": "https://unpkg.com/weifuwu@0.51.0/dist/components/index.js"
        }
      }
    </script>

    <!--
      2. 主应用代码
    -->
    <script type="module">
      // ── 从 CDN 导入核心 API ──
      import { createApp, h } from 'weifuwu/client'

      // ── 从 CDN 导入组件库 ──
      import { Card, Button, Badge } from 'weifuwu/components'

      // ── 定义 Counter 组件 ──
      // 外层函数 = mount（只执行一次），内层函数 = render（每次 dirty/props 变化）
      function Counter(_props, ctx) {
        const $ = ctx.ui.$()

        // mount 阶段初始化（外层直接赋值，挂载期间 _rendering=true 不会触发渲染）
        $.count = 0
        console.log('[Counter] 挂载，初始值 = 0')

        const increment = () => {
          $.count++
        }
        const decrement = () => {
          $.count--
        }
        const reset = () => {
          $.count = 0
        }

        // ── render ──
        return () =>
          h(
            Card,
            { variant: 'default', padding: 'lg' },
            // 标题
            h('p', { className: 'demo-title' }, '⚡ Weifuwu 计数器 (CDN)'),

            // 计数值
            h('div', { className: 'demo-value' }, String($.count)),

            // 奇偶 Badge
            h(
              'div',
              { className: 'demo-status' },
              h(
                Badge,
                {
                  variant: $.count % 2 === 0 ? 'success' : 'warning',
                },
                $.count % 2 === 0 ? '偶数' : '奇数',
              ),
            ),

            h('hr', { className: 'demo-divider' }),

            // 按钮组 — 使用 weifuwu Button 组件
            h(
              'div',
              { className: 'demo-row' },
              h(
                Button,
                {
                  variant: 'secondary',
                  onClick: decrement,
                },
                '➖ 减 1',
              ),

              h(
                Button,
                {
                  variant: 'danger',
                  onClick: reset,
                },
                '↺ 重置',
              ),

              h(
                Button,
                {
                  variant: 'primary',
                  onClick: increment,
                },
                '➕ 加 1',
              ),
            ),
          )
      }

      // ── 创建并挂载 ──
      console.log('[App] 创建应用...')
      const app = createApp()
      app.mount('#root', Counter)
      console.log('[App] 已挂载，开始交互！')
    </script>
  </body>
</html>
